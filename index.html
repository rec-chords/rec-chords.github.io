<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Rec.</title>
  <meta name="theme-color" content="#0a0a0a">
  <script>try { if (localStorage.getItem("fredon.theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {} if (/[?&]groupe=/.test(location.search)) document.documentElement.classList.add("public");</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rec.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><svg class="bg-wave" id="bgWave" preserveAspectRatio="none"></svg><span class="bg-word">Rec.</span></div>
  <header class="topbar">
    <div class="brand">Rec<i>.</i></div>
    <div class="search"><input id="search" type="search" placeholder="Chercher" autocomplete="off" aria-label="Chercher une idée"></div>
    <button class="txt-btn" id="importBtn">importer</button>
    <button class="txt-btn" id="settingsBtn">réglages</button>
    <input type="file" id="importInput" accept="audio/*" multiple hidden>
  </header>

  <nav class="scopes" id="scopes" hidden></nav>
  <section class="hero" id="hero"></section>
  <nav class="tabs" id="tabs"></nav>
  <nav class="filters" id="filters"></nav>
  <div class="status" id="status" hidden></div>

  <main id="board" class="board"></main>

  <div class="empty" id="empty" hidden>
    <p class="empty-title">Rien pour l'instant.</p>
    <p>Enregistre une première idée avec la barre du bas. Tu la rangeras juste après. Ou commence par les paroles avec « + nouvelle chanson ».</p>
  </div>

  <button id="recBtn" class="rec-btn" aria-label="Enregistrer une idée">
    <span class="deck-time" id="deckTime">0:00</span><span class="deck-main"><span class="deck-ring"><span class="rec-dot"></span></span><span>Enregistrer</span><span class="kbd">espace</span></span><span class="deck-meter" id="deckMeter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- Enregistrement en cours -->
  <div class="overlay" id="recOverlay" hidden>
    <div class="rec-panel">
      <div class="rec-top"><span class="rec-live">rec</span><button class="txt-btn rec-input" id="recInput" title="Changer d'entrée"></button><button class="txt-btn" id="recCancel">annuler</button></div>
      <p class="rec-time" id="recTime">0:00</p>
      <p class="rec-target" id="recTarget"></p>
      <div class="rec-metro">
        <button class="txt-btn" id="metroToggle">métronome</button>
        <button class="txt-btn" id="metroMinus" aria-label="Moins vite">−</button>
        <span id="metroBpm">90 bpm</span>
        <button class="txt-btn" id="metroPlus" aria-label="Plus vite">+</button>
        <button class="txt-btn" id="metroTap">taper</button>
      </div>
      <p class="rec-hint" id="metroHint" hidden>Au casque, sinon le clic s'entend dans la prise.</p>
      <canvas id="levels" width="1800" height="180"></canvas>
    </div>
    <!-- Le magnéto pendant une prise : recommencer, arrêter, pause -->
    <div class="stop-bar">
      <span class="deck-time" id="recDeckTime">0:00</span>
      <span class="deck-keys">
        <button class="deck-key" id="recRestart" aria-label="Recommencer la prise"><span class="key-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4L4.5 8.8"/><path d="M4.5 4.3v4.5H9"/></svg></span><span class="key-lbl">recommencer</span></button>
        <button class="deck-main" id="recStop" aria-label="Arrêter l'enregistrement"><span class="deck-ring"><span class="stop-sq"></span></span><span class="deck-lbl">Arrêter</span><span class="kbd">espace</span></button>
        <button class="deck-key" id="recPause" aria-label="Mettre en pause"><span class="key-ring"><i class="pause-ico"></i></span><span class="key-lbl">pause</span></button>
      </span>
      <span class="deck-meter" id="recMeter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <!-- Panneau générique (ranger une prise, menus, réglages…) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
